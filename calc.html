        // --- STATISTICAL HELPERS ---
        function invNorm(p) {
            if (p <= 0 || p >= 1) return NaN;
            const a = [-3.969683028665376e+01, 2.209460984245205e+02, -2.759285104469687e+02, 1.383577518672690e+02, -3.066479806614716e+01, 2.506628277459239e+00];
            const b = [-5.447609879822406e+01, 1.615858368580409e+02, -1.556989798598866e+02, 6.680131188771972e+01, -1.328068155288572e+01];
            const c = [-7.784894002430293e-03, -3.223964580411365e-01, -2.400758277161838e+00, -2.549732539343734e+00, 4.374664141464968e+00, 2.938163982698783e+00];
            const d = [7.784695709041462e-03, 3.224671290700398e-01, 2.445134137142996e+00, 3.754408661907416e+00];
            const p_low = 0.02425;
            const p_high = 1 - p_low;
            let q, x;
            if (p < p_low) {
                q = Math.sqrt(-2 * Math.log(p));
                x = (((((c[0] * q + c[1]) * q + c[2]) * q + c[3]) * q + c[4]) * q + c[5]) / ((((d[0] * q + d[1]) * q + d[2]) * q + d[3]) * q + 1);
            } else if (p <= p_high) {
                q = p - 0.5;
                let r = q * q;
                x = (((((a[0] * r + a[1]) * r + a[2]) * r + a[3]) * r + a[4]) * r + a[5]) * q / (((((b[0] * r + b[1]) * r + b[2]) * r + b[3]) * r + b[4]) * r + 1);
            } else {
                q = Math.sqrt(-2 * Math.log(1 - p));
                x = -(((((c[0] * q + c[1]) * q + c[2]) * q + c[3]) * q + c[4]) * q + c[5]) / ((((d[0] * q + d[1]) * q + d[2]) * q + d[3]) * q + 1));
            }
            return x;
        }

        const stats = {
            sum: arr => arr.reduce((acc, val) => acc + parseFloat(val), 0),
            mean: arr => stats.sum(arr) / arr.length,
            stddev: (arr, isPopulation = false) => {
                if (arr.length < 2) return 0;
                const meanVal = stats.mean(arr);
                const sqDiffs = arr.map(val => Math.pow(parseFloat(val) - meanVal, 2));
                const variance = stats.sum(sqDiffs) / (arr.length - (isPopulation ? 0 : 1));
                return Math.sqrt(variance);
            },
            median: arr => {
                const sorted = [...arr].sort((a, b) => parseFloat(a) - parseFloat(b));
                const mid = Math.floor(sorted.length / 2);
                return sorted.length % 2 !== 0 ? parseFloat(sorted[mid]) : (parseFloat(sorted[mid - 1]) + parseFloat(sorted[mid])) / 2;
            },
            quartile: (arr, q) => {
                const sorted = [...arr].sort((a, b) => parseFloat(a) - parseFloat(b));
                const pos = (sorted.length - 1) * q;
                const base = Math.floor(pos);
                const rest = pos - base;
                if (sorted[base + 1] !== undefined) return parseFloat(sorted[base]) + rest * (parseFloat(sorted[base + 1]) - parseFloat(sorted[base]));
                return parseFloat(sorted[base]);
            },
            combinations: (n, k) => {
                if (k < 0 || k > n) return 0;
                if (k === 0 || k === n) return 1;
                if (k > n / 2) k = n - k;
                let res = 1;
                for (let i = 1; i <= k; i++) {
                    res = res * (n - i + 1) / i;
                }
                return Math.round(res);
            },
            binomialPdf: (n, p, k) => stats.combinations(n, k) * Math.pow(p, k) * Math.pow(1 - p, n - k),
            geometricPdf: (p, k) => Math.pow(1 - p, k - 1) * p,
            normalCdf: (lower, upper, mean, std) => (math.erf((upper - mean) / (std * Math.sqrt(2))) - math.erf((lower - mean) / (std * Math.sqrt(2)))) / 2,
            invNorm: (p, mean, std) => mean + std * invNorm(p),
            invT: (p, df) => {
                const z = invNorm(p);
                if (isNaN(z)) return NaN;
                const z2 = z * z;
                const g1 = (z2 * z + z) / 4;
                const g2 = (5 * z2 * z2 * z + 16 * z2 * z + 3 * z) / 96;
                const g3 = (3 * z2 * z2 * z2 * z + 19 * z2 * z2 * z + 17 * z2 * z - 15 * z) / 384;
                return z + (g1 / df) + (g2 / (df * df)) + (g3 / (df * df * df));
            },
            tCdf: (t, df) => {
                let x = df / (t*t + df);
                function incompleteBeta(x, a, b) {
                    if (x <= 0) return 0;
                    if (x >= 1) return 1;
                    const bt = math.exp(math.gammaln(a + b) - math.gammaln(a) - math.gammaln(b) + a * Math.log(x) + b * Math.log(1 - x));
                    if (x < (a + 1) / (a + b + 2)) {
                        return bt * continuedFraction(x, a, b) / a;
                    } else {
                        return 1 - bt * continuedFraction(1 - x, b, a) / b;
                    }
                }
                function continuedFraction(x, a, b) {
                    const maxIterations = 100;
                    const epsilon = 1e-15;
                    let am = 1, bm = 1, az = 1, qab = a + b, qap = a + 1, qam = a - 1, bz = 1 - qab * x / qap;
                    for (let i = 1; i <= maxIterations; i++) {
                        let d = i * (b - i) * x / ((qam + 2 * i) * (a + 2 * i));
                        let ap = az + d * am;
                        let bp = bz + d * bm;
                        d = -(a + i) * (qab + i) * x / ((a + 2 * i) * (qap + 2 * i));
                        let app = ap + d * az;
                        let bpp = bp + d * bz;
                        am = ap / bpp;
                        bm = bp / bpp;
                        az = app / bpp;
                        bz = 1;
                        if (Math.abs(az - am) < (epsilon * Math.abs(az))) return az;
                    }
                    return az;
                }
                let p = incompleteBeta(x, df / 2, 0.5);
                return t > 0 ? 1 - 0.5 * p : 0.5 * p;
            }
        };
        
        // --- DATA & SPREADSHEET LOGIC ---
        function getColumnByName(name) { return appState.spreadsheet.columns.find(c => c.name === name); }
        function getColumnData(name) {
            const col = getColumnByName(name);
            return col ? col.data.map(v => parseFloat(v)).filter(v => !isNaN(v)) : [];

            if (existing) existing.data = data;
            else appState.spreadsheet.columns.push({ name: name, data: data });
        }

        // --- RENDERING ---
        function render() {
            const currentScrollTop = screenEl.scrollTop;
            const currentScrollLeft = screenEl.scrollLeft;
            screenEl.innerHTML = '';
            closeMenu(); 
            closeModal(); 
            if (appState.currentScreen === 'home') renderHomeScreen();
            else if (appState.currentScreen === 'addDocumentMenu') renderAddDocumentMenu();
            else if (appState.currentScreen === 'spreadsheet') renderSpreadsheet();
            else if (appState.currentScreen === 'calculator') renderCalculator();
            if (appState.modal) renderModal();
            screenEl.scrollTop = currentScrollTop;
            screenEl.scrollLeft = currentScrollLeft;
        }

        function renderHomeScreen() {
            screenEl.innerHTML = `
                <div class="p-2 text-white font-sans">

                        </div>
                    </div>
                </div>
            `;
        }
        
        function renderAddDocumentMenu() {
            appState.menu.isOpen = true;
            appState.menu.items = [
                { label: '1: Add Calculator', action: "startCalculator()" },
                { label: '2: Add Graphs', action: "showMessageModal('Not implemented')" },
                { label: '3: Add Geometry', action: "showMessageModal('Not implemented')" },

            appState.menu.selectedItem = 0;

        function renderSpreadsheet() {
            const { columns, activeCell, isEditing, editValue, selectionStart, selectionEnd } = appState.spreadsheet;
            const numCols = Math.max(columns.length + 2, 10);
            const numRows = 50;
            let tableHTML = '<table class="spreadsheet-table">';
            tableHTML += '<thead><tr><th></th>';
            for (let i = 0; i < numCols; i++) {
                const col = columns[i];
                let colName = col ? col.name : String.fromCharCode(65 + i);
                if (col && col.formula) colName = col.formula;
                tableHTML += `<th class="col-header" data-col="${i}" data-row="-1">${colName}</th>`;
            }
            tableHTML += '</tr></thead><tbody>';
            for (let r = 0; r < numRows; r++) {
                tableHTML += `<tr><td class="row-header">${r + 1}</td>`;
                for (let c = 0; c < numCols; c++) {
                    const cellValue = columns[c] && columns[c].data[r] !== undefined ? columns[c].data[r] : '';
                    let cellClasses = '';
                    if (activeCell.col === c && activeCell.row === r) cellClasses += 'selected';
                    if (selectionStart && selectionEnd) {
                        const minCol = Math.min(selectionStart.col, selectionEnd.col);
                        const maxCol = Math.max(selectionStart.col, selectionEnd.col);
                        const minRow = Math.min(selectionStart.row, selectionEnd.row);
                        const maxRow = Math.max(selectionStart.row, selectionEnd.row);
                        if (c >= minCol && c <= maxCol && r >= minRow && r <= maxRow) {
                            cellClasses += ' in-selection';
                        }
                    }
                    tableHTML += `<td class="${cellClasses}" data-col="${c}" data-row="${r}">
                        ${isEditing && activeCell.col === c && activeCell.row === r ? `<input type="text" value="${editValue}" onblur="finishEditing(this.value)" onkeydown="handleEditKey(event, this.value)" />` : cellValue}
                    </td>`;
                }
                tableHTML += '</tr>';
            }
            tableHTML += '</tbody></table>';
            screenEl.innerHTML = tableHTML;
            if(isEditing) {
                const input = screenEl.querySelector('input');
                if(input) { input.focus(); input.select(); }
            }
        }

            let historyHTML = '<div class="calculator-display">';

        function renderMenu() {
            if (!appState.menu.isOpen) {
                const existingMenu = screenEl.querySelector('.modal');
                if (existingMenu) existingMenu.remove();
                return;

            const { items, selectedItem } = appState.menu;
            let menuHTML = '<div class="modal" style="top: 10px; left: 10px;">';
            items.forEach((item, index) => {
                menuHTML += `<div class="modal-item ${index === selectedItem ? 'selected' : ''}" onclick="${item.action}">${item.label}</div>`;
            });
            menuHTML += '</div>';
            const existingMenu = screenEl.querySelector('.modal');
            if (existingMenu) existingMenu.remove();
            screenEl.insertAdjacentHTML('beforeend', menuHTML);
        }

        function renderModal() {
            const { title, fields, buttons } = appState.modal;
            const colNames = appState.spreadsheet.columns.map(c => c.name).filter(Boolean);
            let modalHTML = `<div class="modal" style="top: 50%; left: 50%; transform: translate(-50%, -50%);">`;
            modalHTML += `<div class="modal-title">${title}</div>`;
            fields.forEach(field => {
                modalHTML += `<div class="modal-field"><label for="${field.id}">${field.label}:</label>`;
                if (field.type === 'select') {
                    modalHTML += `<select id="${field.id}">`;
                    (field.options || colNames).forEach(opt => {
                        modalHTML += `<option value="${opt}">${opt}</option>`;
                    });
                    modalHTML += `</select>`;
                } else if (field.type === 'static') {
                     modalHTML += `<span>${field.label}</span>`;
                } else {
                    modalHTML += `<input type="text" id="${field.id}" value="${field.value || ''}">`;
                }
                modalHTML += `</div>`;
            });
            modalHTML += `<div class="modal-buttons">`;
            buttons.forEach(btn => {
                modalHTML += `<button onclick="${btn.action}">${btn.label}</button>`;
            });
            modalHTML += `</div></div>`;

            if(existingModal) existingModal.remove();
            screenEl.insertAdjacentHTML('beforeend', modalHTML);
        }

        // --- ACTIONS & EVENT HANDLERS ---
        function handleKeyPress(e) {
            if (appState.menu.isOpen) {
                e.preventDefault();
                const { items } = appState.menu;
                if (e.key === 'ArrowUp') appState.menu.selectedItem = (appState.menu.selectedItem - 1 + items.length) % items.length;
                else if (e.key === 'ArrowDown') appState.menu.selectedItem = (appState.menu.selectedItem + 1) % items.length;
                else if (e.key === 'Enter') {
                    const selectedAction = items[appState.menu.selectedItem].action;
                    if (selectedAction) eval(selectedAction);
                }
                renderMenu();
            }
        }
        
        function showAddDocumentMenu() { appState.currentScreen = 'addDocumentMenu'; render(); }
        function startSpreadsheet() { appState.currentScreen = 'spreadsheet'; render(); }
        function startCalculator() { appState.currentScreen = 'calculator'; render(); }
        
        function handleEditKey(event, value) {
            if (event.key === 'Enter') {
                event.preventDefault();
                finishEditing(value, true);
            } else if (event.key === 'Escape') {
                appState.spreadsheet.isEditing = false;
                render();
            }
        }

        function finishEditing(value, fromEnter = false) {
            if (!appState.spreadsheet.isEditing) return;
            const { col, row } = appState.spreadsheet.activeCell;
            if (row === -1) { 
                if (!appState.spreadsheet.columns[col]) addDataColumn(value);
                else appState.spreadsheet.columns[col].name = value;
            } else { 
                if (!appState.spreadsheet.columns[col]) addDataColumn(String.fromCharCode(65 + col));
                const numValue = parseFloat(value);
                appState.spreadsheet.columns[col].data[row] = isNaN(numValue) ? value : numValue;
            }
            appState.spreadsheet.isEditing = false;
            appState.spreadsheet.editValue = '';
            if (fromEnter) {
                appState.spreadsheet.activeCell.row++;
                render();
            } else {
                setTimeout(render, 0);
            }
        }
        
        function showMenu() {
            if (appState.menu.isOpen) { closeMenu(); return; }
            let menuConfig = { isOpen: true, path: ['root'], items: [], selectedItem: 0 };
            if (appState.currentScreen === 'spreadsheet' || appState.currentScreen === 'calculator') {
                menuConfig.items = [
                    { label: '1: Actions', action: 'showActionsSubMenu()' },
                    { label: '5: Probability', action: 'showProbabilitySubMenu()' },
                    { label: '6: Statistics', action: 'showStatsSubMenu()' },
                ];
                menuConfig.selectedItem = 0;
            }
            appState.menu = menuConfig;
            renderMenu();
        }

        function closeMenu() {
            appState.menu.isOpen = false;
            appState.menu.path = [];
            const existingMenu = screenEl.querySelector('.modal');
            if (existingMenu && !appState.modal) existingMenu.remove();
        }

        function closeModal() {
            appState.modal = null;
            const existingModal = screenEl.querySelector('.modal');
            if (existingModal) existingModal.remove();

            renderMenu();

        function showClearConfirmModal() {
            closeMenu();
            appState.modal = {
                title: 'Confirm Clear',
                fields: [{ type: 'static', label: 'Clear all spreadsheet data?' }],
                buttons: [
                    { label: 'OK', action: 'clearSpreadsheet()' },
                    { label: 'Cancel', action: 'render()' }

            renderModal();

        function clearSpreadsheet() {
            appState.spreadsheet.columns = [];
            appState.spreadsheet.activeCell = { col: 0, row: 0 };
            appState.spreadsheet.selectionStart = null;

        function copySelection() {

            const minCol = Math.min(selectionStart.col, selectionEnd.col);
            const maxCol = Math.max(selectionStart.col, selectionEnd.col);
            const minRow = Math.min(selectionStart.row, selectionEnd.row);
            const maxRow = Math.max(selectionStart.row, selectionEnd.row);
            let clipboardData = [];
            for (let r = minRow; r <= maxRow; r++) {
                let rowData = [];
                for (let c = minCol; c <= maxCol; c++) {
                    const cellValue = columns[c] && columns[c].data[r] !== undefined ? columns[c].data[r] : '';
                    rowData.push(cellValue);
                }
                clipboardData.push(rowData.join('\t'));
            }
            appState.spreadsheet.clipboard = clipboardData.join('\n');
            showMessageModal("Selection copied!");
        }

        function pasteSelection() {
            const pasteData = appState.spreadsheet.clipboard;
            if (!pasteData) {
                showMessageModal("Clipboard is empty.");
                return;
            }
            const rows = pasteData.split('\n');
            const startCell = appState.spreadsheet.activeCell;
            rows.forEach((rowStr, rowIndex) => {
                const cells = rowStr.split('\t');
                cells.forEach((cellStr, colIndex) => {
                    const targetRow = startCell.row + rowIndex;
                    const targetCol = startCell.col + colIndex;
                    while (targetCol >= appState.spreadsheet.columns.length) {
                        addDataColumn(String.fromCharCode(65 + appState.spreadsheet.columns.length));
                    }
                    const numValue = parseFloat(cellStr);
                    appState.spreadsheet.columns[targetCol].data[targetRow] = isNaN(numValue) ? cellStr : numValue;
                });
            });
            render();
        }

        function run1VarStats() {
            const listName = document.getElementById('x1list').value;
            const data = getColumnData(listName);
            if (data.length === 0) { showMessageModal('Selected list is empty.'); return; }
            const results = {
                'Title': 'One-Var Stats', 'x̄': stats.mean(data).toFixed(4), 'Σx': stats.sum(data).toFixed(4),
                'Σx²': stats.sum(data.map(x => x*x)).toFixed(4), 'Sx': stats.stddev(data, false).toFixed(4),
                'σx': stats.stddev(data, true).toFixed(4), 'n': data.length, 'MinX': Math.min(...data),
                'Q₁X': stats.quartile(data, 0.25), 'MedianX': stats.median(data),
                'Q₃X': stats.quartile(data, 0.75), 'MaxX': Math.max(...data)
            };
            const resultColIndex = getNextAvailableColumnIndex();
            addDataColumn(String.fromCharCode(65 + resultColIndex), Object.keys(results));
            addDataColumn(String.fromCharCode(65 + resultColIndex + 1), Object.values(results));
            appState.spreadsheet.columns[resultColIndex+1].formula = `=OneVar(${listName})`;
            render();
        }

        function showLinRegModal() {
            closeMenu();
            appState.modal = {
                title: 'Linear Regression (a+bx)',
                fields: [ { id: 'xlist', label: 'X List', type: 'select' }, { id: 'ylist', label: 'Y List', type: 'select' } ],
                buttons: [ { label: 'OK', action: 'runLinReg()' }, { label: 'Cancel', action: 'render()' } ]
            };

        function runLinReg() {
            const xListName = document.getElementById('xlist').value;
            const yListName = document.getElementById('ylist').value;
            const xData = getColumnData(xListName);
            const yData = getColumnData(yListName);
            if (xData.length < 2 || yData.length < 2 || xData.length !== yData.length) {
                showMessageModal('X and Y lists must have the same number of numerical data points (at least 2).');
                return;
            }
            const n = xData.length;
            const sumX = stats.sum(xData);
            const sumY = stats.sum(yData);
            const sumXY = stats.sum(xData.map((x, i) => x * yData[i]));
            const sumX2 = stats.sum(xData.map(x => x * x));
            const sumY2 = stats.sum(yData.map(y => y * y));
            const b = (n * sumXY - sumX * sumY) / (n * sumX2 - sumX * sumX);
            const a = (sumY / n) - b * (sumX / n);
            const rNumerator = (n * sumXY - sumX * sumY);
            const rDenominator = Math.sqrt((n * sumX2 - sumX * sumX) * (n * sumY2 - sumY * sumY));
            const r = rNumerator / rDenominator;
            const residuals = xData.map((x, i) => yData[i] - (a + b * x));
            const s = Math.sqrt(stats.sum(residuals.map(res => res * res)) / (n - 2));
            const sx = stats.stddev(xData);
            const seSlope = s / (sx * Math.sqrt(n - 1));

            const results = {
                'Title': 'LinReg (a+bx)', 'RegEqn': 'a+b*x', 'a': a.toFixed(4), 'b': b.toFixed(4),
                'r²': (r*r).toFixed(4), 'r': r.toFixed(4), 'SE Slope': seSlope.toFixed(4)
            };
            const resultColIndex = getNextAvailableColumnIndex();
            addDataColumn(String.fromCharCode(65 + resultColIndex), Object.keys(results));
            addDataColumn(String.fromCharCode(65 + resultColIndex + 1), Object.values(results));
            appState.spreadsheet.columns[resultColIndex+1].formula = `=LinRegBx(${xListName},${yListName})`;
            addDataColumn('statresid', residuals.map(r => r.toFixed(4)));
            render();
        }

        function chooseTIntervalModal() {

        function showTIntervalStatsModal() {
            startCalculator();

                title: 't Interval (Stats)',

        function runTIntervalFromStats() {
            const mean = parseFloat(document.getElementById('mean').value);
            const sx = parseFloat(document.getElementById('sx').value);
            const n = parseInt(document.getElementById('n').value);
            const cLevel = parseFloat(document.getElementById('clevel').value);
            if (isNaN(mean) || isNaN(sx) || isNaN(n) || isNaN(cLevel)) { showMessageModal("Invalid input. Please enter numbers."); return; }
            runTInterval(mean, sx, n, cLevel);
        }

        function runTIntervalFromData() {
            const listName = document.getElementById('list').value;
            const cLevel = parseFloat(document.getElementById('clevel').value);
            const data = getColumnData(listName);
            if (data.length < 2) { showMessageModal("Selected list must contain at least 2 numbers."); return; }
            const mean = stats.mean(data);
            const sx = stats.stddev(data);
            const n = data.length;
            runTInterval(mean, sx, n, cLevel);
        }

        function runTInterval(mean, sx, n, cLevel) {
            const df = n - 1;
            const alpha = 1 - cLevel;
            const tStar = stats.invT(1 - alpha / 2, df);
            const me = tStar * (sx / Math.sqrt(n));
            const lower = mean - me;
            const upper = mean + me;
            const output = `t Interval\n` + `(${lower.toFixed(4)}, ${upper.toFixed(4)})\n` + `ME=${me.toFixed(4)}\n`+ `df=${df}\n` + `x̄=${mean.toFixed(4)}\n` + `Sx=${sx.toFixed(4)}\n` + `n=${n}`;
            appState.calculator.history.push({ input: `tInterval(...)`, output: output });
            render();
        }

        function showTTestModal() {
            startCalculator();
            appState.modal = {
                title: 't Test',
                fields: [ 
                    { id: 'mu0', label: 'μ₀' }, { id: 'mean', label: 'x̄' },
                    { id: 'sx', label: 'Sx' }, { id: 'n', label: 'n' },
                    { id: 'alt', label: 'Alternate Hyp', type: 'select', options: ['μ ≠ μ₀', 'μ < μ₀', 'μ > μ₀'] },
                ],
                buttons: [ { label: 'OK', action: 'runTTest()' }, { label: 'Cancel', action: 'render()' } ]
            };
            renderModal();
        }

        function runTTest() {
            const mu0 = parseFloat(document.getElementById('mu0').value);
            const mean = parseFloat(document.getElementById('mean').value);
            const sx = parseFloat(document.getElementById('sx').value);
            const n = parseInt(document.getElementById('n').value);
            const alt = document.getElementById('alt').value;
            if (isNaN(mu0) || isNaN(mean) || isNaN(sx) || isNaN(n)) { showMessageModal("Invalid input. Please enter numbers."); return; }
            const df = n - 1;
            const tStat = (mean - mu0) / (sx / Math.sqrt(n));
            let pVal;
            if (alt === 'μ < μ₀') pVal = stats.tCdf(tStat, df);
            else if (alt === 'μ > μ₀') pVal = 1 - stats.tCdf(tStat, df);
            else pVal = 2 * (1 - stats.tCdf(Math.abs(tStat), df));
            const output = `t-Test ${alt}\n` + `t=${tStat.toFixed(4)}\n` + `p=${pVal.toFixed(4)}\n` + `df=${df}\n` + `x̄=${mean}\n` + `Sx=${sx}\n` + `n=${n}`;
            appState.calculator.history.push({ input: `tTest(...)`, output: output });
            render();
        }

        function handleSystemPaste(event) {
            if (appState.currentScreen !== 'spreadsheet') return;
            event.preventDefault();
            appState.spreadsheet.clipboard = event.clipboardData.getData('text');
            pasteSelection();
        }

        function handleMouseDown(event) {
            if (appState.currentScreen !== 'spreadsheet' || !event.target.matches('td, th[data-col]')) return;
            const col = parseInt(event.target.dataset.col);
            const row = parseInt(event.target.dataset.row);
            if (isNaN(col) || isNaN(row)) return;
            
            appState.spreadsheet.isEditing = false;
            appState.spreadsheet.activeCell = { col, row };
            appState.spreadsheet.isSelecting = true;
            appState.spreadsheet.selectionStart = { col, row };
            appState.spreadsheet.selectionEnd = { col, row };
            render();
        }

        function handleMouseMove(event) {
            if (!appState.spreadsheet.isSelecting || !event.target.matches('td, th[data-col]')) return;
            const col = parseInt(event.target.dataset.col);
            const row = parseInt(event.target.dataset.row);
            if (isNaN(col) || isNaN(row)) return;
            if (appState.spreadsheet.selectionEnd.col !== col || appState.spreadsheet.selectionEnd.row !== row) {
                appState.spreadsheet.selectionEnd = { col, row };
                render();
            }
        }

        function handleMouseUp() {
            appState.spreadsheet.isSelecting = false;
        }

        document.addEventListener('paste', handleSystemPaste);
        screenEl.addEventListener('mousedown', handleMouseDown);
        screenEl.addEventListener('mousemove', handleMouseMove);
        document.addEventListener('mouseup', handleMouseUp);

        render();

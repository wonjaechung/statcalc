<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NspireX: Next-Gen Calculator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/11.8.0/math.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg, #18181b);
      color: var(--fg, #f4f4f5);
      transition: background 0.3s, color 0.3s;
    }
    .nspirex-container {
      max-width: 1100px;
      margin: 2rem auto;
      background: var(--panel, #23232a);
      border-radius: 1.5rem;
      box-shadow: 0 8px 32px rgba(0,0,0,0.25);
      padding: 2rem;
      display: flex;
      gap: 2rem;
      flex-wrap: wrap;
    }
    .nspirex-panel {
      background: var(--panel, #23232a);
      border-radius: 1rem;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      padding: 1.5rem;
      flex: 1 1 320px;
      min-width: 320px;
      max-width: 100%;
      min-height: 400px;
      display: flex;
      flex-direction: column;
    }
    .nspirex-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.5rem;
    }
    .nspirex-btn {
      background: var(--btn, #3b82f6);
      color: #fff;
      border: none;
      border-radius: 0.5rem;
      padding: 0.5rem 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .nspirex-btn:hover {
      background: #2563eb;
    }
    .nspirex-toggle {
      background: none;
      border: none;
      color: var(--fg, #f4f4f5);
      font-size: 1.2rem;
      cursor: pointer;
      margin-left: 1rem;
    }
    .nspirex-input {
      background: var(--input, #18181b);
      color: var(--fg, #f4f4f5);
      border: 1px solid #444;
      border-radius: 0.5rem;
      padding: 0.5rem 1rem;
      font-size: 1.1rem;
      margin-bottom: 0.5rem;
      width: 100%;
    }
    .nspirex-history {
      flex: 1;
      overflow-y: auto;
      background: var(--input, #18181b);
      border-radius: 0.5rem;
      padding: 0.5rem 1rem;
      margin-bottom: 0.5rem;
      max-height: 200px;
    }
    .nspirex-history-entry {
      margin-bottom: 0.5rem;
      font-size: 0.95rem;
    }
    .nspirex-spreadsheet-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.95rem;
      background: var(--input, #18181b);
      border-radius: 0.5rem;
      overflow: hidden;
    }
    .nspirex-spreadsheet-table th, .nspirex-spreadsheet-table td {
      border: 1px solid #444;
      padding: 0.25rem 0.5rem;
      min-width: 60px;
      text-align: right;
    }
    .nspirex-spreadsheet-table th {
      background: #27272a;
      color: #a1a1aa;
      position: sticky;
      top: 0;
      z-index: 2;
    }
    .nspirex-spreadsheet-table td.selected {
      background: #3b82f6;
      color: #fff;
    }
    .nspirex-modal {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .nspirex-modal-content {
      background: var(--panel, #23232a);
      color: var(--fg, #f4f4f5);
      border-radius: 1rem;
      padding: 2rem;
      min-width: 320px;
      max-width: 90vw;
      box-shadow: 0 4px 32px rgba(0,0,0,0.25);
    }
    .nspirex-modal-content h2 {
      margin-top: 0;
    }
    .nspirex-modal-content label {
      display: block;
      margin: 0.5rem 0 0.2rem 0;
    }
    .nspirex-modal-content input, .nspirex-modal-content select {
      width: 100%;
      padding: 0.4rem 0.7rem;
      border-radius: 0.4rem;
      border: 1px solid #444;
      background: var(--input, #18181b);
      color: var(--fg, #f4f4f5);
      margin-bottom: 1rem;
    }
    .nspirex-modal-content button {
      margin-top: 1rem;
    }
    .nspirex-graph-canvas {
      width: 100%;
      height: 260px;
      background: #18181b;
      border-radius: 0.5rem;
    }
    .nspirex-help {
      font-size: 0.95rem;
      color: #a1a1aa;
      margin-top: 1rem;
    }
    @media (max-width: 900px) {
      .nspirex-container {
        flex-direction: column;
        padding: 1rem;
      }
      .nspirex-panel {
        min-width: 0;
        padding: 1rem;
      }
    }
  </style>
</head>
<body>
  <!-- The app will be rendered here by JavaScript -->
  <div id="nspirex-root"></div>
  <script>
    // ... The full app code will be injected here ...
  </script>
</body>
</html>
